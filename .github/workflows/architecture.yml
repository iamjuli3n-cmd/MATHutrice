# Runs the two checks documented in mathutrice/README.md, "Running the check":
# every import crossing a package boundary reaches a public name, and no two
# packages import each other. They are the commands a contributor runs locally,
# so a red run here is reproducible with two lines in a terminal.
#
# Then the deploy that waits on them, to two environments, each an App Service
# app with its own settings and secrets, held in the GitHub Environment of the
# same name:
#
# - staging: a push to the default branch whose checks pass is built into one
#   image, tagged with its commit, and deployed to staging.
# - production: only by promotion, a run started by hand (workflow_dispatch).
#   It deploys the image of staging's last green deploy, never one built for
#   the occasion, so production only receives an image staging already ran.
#
# Both log in to Azure through OpenID Connect, as their GitHub Environment: no
# Azure password or publish profile is stored anywhere.
name: Architecture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    name: architecture
    # A promotion builds nothing, so it has nothing to check.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version: setup-uv publishes no floating `v10` tag.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # uv installs the interpreter pinned in .python-version itself, so there
      # is no separate Python setup step to keep in sync with it. The dev group,
      # which is where tach lives, is part of a default sync.
      - run: uv sync

      # scripts/check_cycles.py reads the real import graph from `tach map`, and
      # both commands expect the directory holding tach.toml -- the checkout
      # root, which is where a step starts.
      - run: uv run tach check

      - run: uv run python scripts/check_cycles.py

  # On a push to the default branch alone, once every job of the check has
  # passed. Never on a pull request, a red run, or a commit not pushed.
  deploy-staging:
    name: deploy to staging
    needs: architecture
    if: github.event_name == 'push' && github.ref == 'refs/heads/course-2026-fallback-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time, in the order pushed.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7

      # One image per commit, tagged with it, so that whatever runs can be
      # traced to the run that passed on it. A commit pushed twice is built
      # once. The source label links the package to this repository on GHCR.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the image to staging
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ steps.image.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          posthog-project-token: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          posthog-environment: staging

  # The Promotion, first half: find the image of staging's last green deploy.
  # It reads this workflow's own runs, not the staging app: a deploy sets the
  # image before it waits for it to answer, so after a failed deploy the app is
  # still set to the image that never answered. That image is never promoted.
  last-green-staging:
    name: find staging's last green deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      image: ${{ steps.find.outputs.image }}
    steps:
      # The push runs on the default branch, newest first. The first whose
      # `deploy to staging` job passed built and deployed the image tagged with
      # its commit. Every run skipped is logged. With no such run, nothing is
      # promoted. `deploy to staging` is the job's name above: renaming it
      # means renaming it here too.
      - name: Find the last run whose deploy to staging passed
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_BRANCH: course-2026-fallback-ci
        run: |
          runs=$(gh run list --workflow architecture.yml --branch "$DEPLOY_BRANCH" --event push --limit 100 \
            --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"')
          while read -r run sha; do
            [ -n "$run" ] || continue
            deploy=$(gh run view "$run" --json jobs --jq '.jobs[] | select(.name == "deploy to staging") | .conclusion')
            if [ "$deploy" = success ]; then
              image="ghcr.io/${GITHUB_REPOSITORY,,}:$sha"
              echo "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, commit $sha: deploy to staging passed"
              echo "Promoting $image"
              echo "image=$image" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Run $run, commit $sha: deploy to staging ${deploy:-has no result}, skipped"
          done <<< "$runs"
          echo "No push run on $DEPLOY_BRANCH has a deploy to staging that passed: nothing to promote" >&2
          exit 1

  # The Promotion, second half: deploy that same image to production. Nothing
  # is built; only production's own settings and secrets differ.
  promote-production:
    name: promote to production
    needs: last-green-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      # For the deploy action only: nothing is built from this checkout.
      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy that image to production
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ needs.last-green-staging.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          session-secret: ${{ secrets.SESSION_SECRET }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          posthog-project-token: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          posthog-environment: production
          # Production calls its LLM through the course's relay, whose URL (with
          # its token) is a secret of the production Environment. Staging keeps
          # Mistral's own URL, the action's default.
          llm-base-url: ${{ secrets.LLM_BASE_URL }}
